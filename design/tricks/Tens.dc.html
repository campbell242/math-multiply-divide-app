<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Jersey+25&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #f3eee1; color: #2b2b24; font-family: 'Nunito Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #3d7a22; } a:hover { color: #57a636; }
    img { image-rendering: pixelated; }
  </style>
</helmet>
<div style="width:390px;min-height:840px;margin:0 auto;background:#f3eee1;display:flex;flex-direction:column">
  <div style="height:12px;background:url('tx-grass.png');background-size:16px;flex:none"></div>
  <div style="height:8px;background:url('tx-dirt.png');background-size:16px;flex:none"></div>

  <div style="display:flex;align-items:center;gap:10px;padding:13px 18px 2px">
    <span style="font-family:'Jersey 25',monospace;font-size:24px;color:#8a8578;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;margin-left:-12px">‹</span>
    <div style="font-family:'Jersey 25',monospace;font-size:23px">Slide in a zero</div>
    <div style="margin-left:auto;font-family:'Jersey 25',monospace;font-size:22px;color:#8a8578">× 10</div>
  </div>
  <div style="font-size:12.5px;font-weight:600;color:#6b675c;padding:0 18px 12px;line-height:1.5">Ten of something keeps your number. A zero slides onto the end.</div>

  <div style="display:flex;justify-content:center;align-items:center;padding:0 18px;min-height:250px">
    <div style="display:flex;gap:6px">
      <sc-for list="{{digits}}" as="d" hint-placeholder-count="1">
        <div style="{{d.style}}">{{d.ch}}</div>
      </sc-for>
      <div style="{{zero}}">0</div>
    </div>
  </div>

  <div style="padding:14px 18px 0">
    <div style="background:#fffdf6;border:3px solid #2b2b24;padding:11px 14px">
      <sc-for list="{{ledger}}" as="line" hint-placeholder-count="3">
        <div style="{{line.style}}">{{line.text}}</div>
      </sc-for>
    </div>
  </div>

  <div style="padding:11px 18px 0">
    <div style="{{slab}}">
      <div style="height:8px;background:url('tx-stone.png');background-size:16px"></div>
      <div style="text-align:center;font-family:'Jersey 25',monospace;font-size:38px;line-height:1;padding:11px 0 13px">{{result}}</div>
    </div>
  </div>

  <div style="flex:1;min-height:10px"></div>
  <div style="font-family:'Jersey 25',monospace;font-size:14px;color:#6b675c;padding:0 12px 7px">TRY IT WITH</div>
  <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:0 12px 12px">
    <sc-for list="{{chips}}" as="chip" hint-placeholder-count="11">
      <div style="{{chip.style}}" onClick="{{chip.pick}}">{{chip.v}}</div>
    </sc-for>
  </div>
  <div style="padding:0 18px 18px">
    <div style="font-family:'Jersey 25',monospace;font-size:20px;color:#2b2b24;text-align:center;padding:14px;background:#cfc8b2;border:3px solid #4a4a44;box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(0,0,0,.16);cursor:pointer" onClick="{{replay}}">Again ›</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":840}}'>
/* The DIGITS stage (work order D): ×10 is a digit operation, not an array
   transform — seventy blocks would bury the thing it teaches. Same page
   frame, same play-once timeline; the stage is digit tiles in the paper
   language, and the zero slides in from the right. ×11's "say the digit
   twice" takes this same stage when that page is drawn. */
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { n: 7, ph: 99 };
    this.timers = [];
    this.marks = [30, 1550, 2750];
  }
  componentDidMount() { this.play(); }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  reduced() {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (e) { return false; }
  }
  play(n) {
    this.timers.forEach(clearTimeout);
    const next = n ?? this.state.n;
    if (this.reduced()) { this.setState({ n: next, ph: 2 }); return; }
    this.setState({ n: next, ph: -1 });
    this.timers = this.marks.map((ms, i) =>
      setTimeout(() => this.setState({ n: next, ph: i }), ms));
  }
  renderVals() {
    const n = this.state.n, ph = this.state.ph;
    const ease = 'cubic-bezier(.2,.8,.3,1)';
    const tile = 'width:44px;height:56px;box-sizing:border-box;flex:none;display:flex;align-items:center;justify-content:center;'
      + 'background:#fffdf6;border:3px solid #20241a;'
      + 'box-shadow:inset 0 3px 0 rgba(255,255,255,.85),inset 0 -4px 0 rgba(0,0,0,.14);'
      + "font-family:'Jersey 25',monospace;font-size:34px;line-height:1;";
    const digits = String(n).split('').map((ch, i) => ({
      ch: ch,
      style: tile
        + 'opacity:' + (ph >= 0 ? '1' : '0') + ';'
        + 'transform:translateY(' + (ph >= 0 ? '0' : '-5px') + ');'
        + 'transition:opacity 280ms ' + ease + ' ' + (ph === 0 ? i * 90 : 0) + 'ms,'
        + 'transform 280ms ' + ease + ' ' + (ph === 0 ? i * 90 : 0) + 'ms;'
    }));
    const lineStyle = (lit) =>
      "font-family:'Jersey 25',monospace;font-size:22px;line-height:1.5;color:#2b2b24;"
      + 'opacity:' + (lit ? '1' : '.26') + ';transition:opacity 260ms ease;';
    const chipBase = "font-family:'Jersey 25',monospace;font-size:24px;text-align:center;line-height:1;padding:17px 0;"
      + 'background:#fffdf6;border:3px solid #20241a;box-sizing:border-box;cursor:pointer;';
    return {
      digits: digits,
      zero: tile
        + 'opacity:' + (ph >= 1 ? '1' : '0') + ';'
        + 'transform:translateX(' + (ph >= 1 ? '0' : '16px') + ');'
        + 'transition:opacity 300ms ' + ease + ',transform 300ms ' + ease + ';',
      ledger: [
        { text: 'start with ' + n, style: lineStyle(ph >= 0) },
        { text: 'slide a zero on the end', style: lineStyle(ph >= 1) },
        { text: '= ' + (10 * n), style: lineStyle(ph >= 2) },
      ],
      slab: 'background:#fffdf6;border:3px solid #2b2b24;box-shadow:0 5px 0 rgba(43,43,36,.14);'
        + 'opacity:' + (ph >= 2 ? '1' : '0') + ';transform:translateY(' + (ph >= 2 ? '0' : '6px') + ');'
        + 'transition:opacity 300ms ' + ease + ',transform 300ms ' + ease + ';',
      result: '10 × ' + n + ' = ' + (10 * n),
      replay: () => this.play(),
      chips: Array.from({ length: 11 }, (u, k) => {
        const v = k + 2, sel = v === n;
        return {
          v: v,
          pick: () => this.play(v),
          style: chipBase + (sel
            ? 'outline:3px solid #57a636;color:#3d7a22;'
            : 'box-shadow:inset 0 3px 0 rgba(255,255,255,.85),inset 0 -5px 0 rgba(0,0,0,.14);color:#2b2b24;')
        };
      })
    };
  }
}
</script>
</body>
</html>
