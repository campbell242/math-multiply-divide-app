<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Jersey+25&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #f3eee1; color: #2b2b24; font-family: 'Nunito Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #3d7a22; } a:hover { color: #57a636; }
    img { image-rendering: pixelated; }
    @media (prefers-reduced-motion: reduce) { * { transition-duration: 0ms !important; transition-delay: 0ms !important; } }
  </style>
</helmet>
<div style="width:390px;min-height:820px;margin:0 auto;background:#f3eee1;display:flex;flex-direction:column">
  <div style="height:12px;background:url('tx-grass.png');background-size:16px;flex:none"></div>
  <div style="height:8px;background:url('tx-dirt.png');background-size:16px;flex:none"></div>

  <div style="display:flex;align-items:center;gap:10px;padding:14px 16px 4px">
    <span style="font-family:'Jersey 25',monospace;font-size:24px;color:#8a8578;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;margin-left:-12px">‹</span>
    <div style="font-family:'Jersey 25',monospace;font-size:24px">Fives</div>
    <span style="margin-left:auto;font-family:'Jersey 25',monospace;font-size:15px;color:#8a8578">TRICKS</span>
  </div>

  <div style="padding:2px 18px 0">
    <div style="font-family:'Jersey 25',monospace;font-size:27px;line-height:1.1">FIVES MAKE TENS</div>
    <div style="font-size:13px;color:#6b675c;font-weight:600;margin-top:3px">Two fives snap into a ten. Count tens, then add the spare five.</div>
  </div>

  <div style="margin:12px 18px 0;background:#fffdf6;border:3px solid #2b2b24;box-shadow:inset 0 4px 0 rgba(255,255,255,.85),inset 0 -6px 0 rgba(0,0,0,.14);padding:14px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:12px">
    <div style="font-family:'Jersey 25',monospace;font-size:44px;line-height:1;display:flex;align-items:baseline;gap:10px">
      <span>{{fact}}</span>
      <span style="{{ansStyle}}">{{answer}}</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
      <sc-for list="{{pairs}}" as="p" hint-placeholder-count="3">
        <div style="{{p.wrap}}">
          <div style="display:flex;gap:3px">
            <sc-for list="{{p.a}}" as="c" hint-placeholder-count="5">
              <div style="{{p.cell}}"></div>
            </sc-for>
          </div>
          <div style="display:flex;gap:3px">
            <sc-for list="{{p.b}}" as="c" hint-placeholder-count="5">
              <div style="{{p.cell}}"></div>
            </sc-for>
          </div>
          <div style="{{p.tag}}">10</div>
        </div>
      </sc-for>
      <sc-if value="{{odd}}" hint-placeholder-val="{{ true }}">
        <div style="{{loneWrap}}">
          <div style="display:flex;gap:3px">
            <sc-for list="{{five}}" as="c" hint-placeholder-count="5">
              <div style="{{loneCell}}"></div>
            </sc-for>
          </div>
          <div style="{{loneTag}}">5</div>
        </div>
      </sc-if>
    </div>
    <div style="display:flex;flex-direction:column;gap:2px;align-items:center">
      <div style="{{s1}}">{{l1}}</div>
      <div style="{{s2}}">{{l2}}</div>
      <div style="{{s3}}">{{l3}}</div>
    </div>
  </div>

  <div style="margin-top:auto;padding:16px 16px 18px">
    <div style="font-family:'Jersey 25',monospace;font-size:13px;color:#3d7a22;margin-bottom:8px">TRY A NUMBER</div>
    <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px">
      <sc-for list="{{chips}}" as="chip" hint-placeholder-count="11">
        <div style="{{chip.style}}" onClick="{{chip.pick}}">{{chip.v}}</div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { n: 7, phase: 0 };
    this.waits = [700, 2200, 2200, 2800];
  }
  componentDidMount() { this.arm(this.state.phase); }
  componentWillUnmount() { clearTimeout(this.t); }
  arm(phase) {
    clearTimeout(this.t);
    this.t = setTimeout(() => {
      const next = (phase + 1) % 4;
      this.setState({ phase: next });
      this.arm(next);
    }, this.waits[phase]);
  }
  pick(v) {
    clearTimeout(this.t);
    this.setState({ n: v, phase: 0 });
    this.arm(0);
  }
  renderVals() {
    const n = this.state.n, ph = this.state.phase;
    const ease = 'cubic-bezier(.2,.8,.3,1)';
    const tens = Math.floor(n / 2), odd = n % 2 === 1;
    const cellBase = 'width:22px;height:22px;flex:none;border:2px solid #20241a;transition:background 240ms,border-color 240ms;';
    const dirt = 'background:#7a5233;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.28);';
    const tagBase = "font-family:'Jersey 25',monospace;font-size:17px;width:24px;text-align:center;transition:opacity 240ms;";
    const merged = ph >= 2;
    const pairs = Array.from({ length: tens }, (u, i) => {
      const op = ph >= 1 ? 1 : 0;
      const delay = ph === 1 ? i * 90 : 0;
      return {
        a: Array.from({ length: 5 }, () => ({})),
        b: Array.from({ length: 5 }, () => ({})),
        cell: cellBase + dirt,
        wrap: 'display:inline-flex;align-items:center;padding:3px 6px;gap:' + (merged ? '4px' : '12px') + ';'
            + 'border:3px solid ' + (merged ? '#20241a' : 'transparent') + ';'
            + 'opacity:' + op + ';'
            + 'transition:gap 300ms ' + ease + ',border-color 240ms,opacity 240ms ' + ease + ' ' + delay + 'ms;',
        tag: tagBase + 'color:#2b2b24;opacity:' + (merged ? 1 : 0) + ';'
      };
    });
    const lineBase = "font-family:'Jersey 25',monospace;font-size:20px;line-height:1.25;padding:1px 10px;transition:color 240ms,background 240ms;";
    const pale = 'color:#d5d2c9;', ink = 'color:#2b2b24;';
    const chipBase = "min-height:56px;display:flex;align-items:center;justify-content:center;font-family:'Jersey 25',monospace;font-size:22px;border:3px solid #20241a;box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(0,0,0,.16);cursor:pointer;";
    const tensWord = tens === 1 ? 'ten' : 'tens';
    return {
      fact: '5 × ' + n,
      answer: '= ' + (5 * n),
      ansStyle: 'font-size:32px;color:#3d7a22;display:inline-block;transition:opacity 240ms ' + ease + ',transform 240ms cubic-bezier(.34,1.56,.64,1);'
              + (ph >= 3 ? 'opacity:1;transform:scale(1);' : 'opacity:0;transform:scale(.4);'),
      l1: n + ' fives',
      l2: odd ? tens + ' ' + tensWord + ' + 1 five' : tens + ' ' + tensWord,
      l3: '= ' + (5 * n),
      s1: lineBase + (ph >= 1 ? ink : pale),
      s2: lineBase + (ph >= 2 ? ink : pale),
      s3: lineBase + (ph >= 3 ? 'color:#3d7a22;background:#eaf5df;' : pale),
      pairs: pairs,
      odd: odd,
      five: Array.from({ length: 5 }, () => ({})),
      loneCell: cellBase + dirt,
      loneWrap: 'display:inline-flex;align-items:center;padding:3px 6px;gap:4px;'
              + 'border:3px solid ' + (merged ? '#20241a' : 'transparent') + ';'
              + 'opacity:' + (ph >= 1 ? 1 : 0) + ';'
              + 'transition:border-color 240ms,opacity 240ms ' + ease + ' ' + (ph === 1 ? tens * 90 : 0) + 'ms;',
      loneTag: tagBase + 'color:#2b2b24;opacity:' + (merged ? 1 : 0) + ';',
      chips: Array.from({ length: 11 }, (u, k) => {
        const v = k + 2, sel = v === n;
        return {
          v: v,
          pick: () => this.pick(v),
          style: chipBase + (sel ? 'background:#eaf5df;border-color:#2c5c1a;color:#3d7a22;' : 'background:#fffdf6;color:#2b2b24;')
        };
      })
    };
  }
}
</script>
</body>
</html>
